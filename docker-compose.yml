services:
  app:
    build:
      context: .
    env_file:
      - .env
    ports:
      - "${PORT:-8085}:8085"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    shm_size: '1gb'
  scheduler:
    build:
      context: .
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    command: node scripts/scheduler.js